<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Run</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #e0e0e0;
    overflow: hidden;
  }
  h1 {
    font-size: 13px;
    letter-spacing: 4px;
    color: #444;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  #game-wrapper {
    position: relative;
    border: 2px solid #2a2a2a;
    background: #111;
    overflow: hidden;
  }
  canvas { display: block; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,10,0.88);
    gap: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay-title { font-size: 18px; color: #e0e0e0; letter-spacing: 2px; }
  #overlay-sub { font-size: 8px; color: #555; letter-spacing: 2px; }
  #start-btn {
    margin-top: 8px;
    padding: 12px 28px;
    background: none;
    border: 2px solid #e0e0e0;
    color: #e0e0e0;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: background 0.15s, color 0.15s;
  }
  #start-btn:hover { background: #e0e0e0; color: #0a0a0a; }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 700px;
    padding: 6px 2px 10px;
    font-size: 9px;
    color: #444;
    letter-spacing: 2px;
  }
  #hud span { color: #aaa; }
</style>
</head>
<body>

<h1>Dino Run</h1>

<div id="hud">
  <div>SCORE <span id="score-display">00000</span></div>
  <div>HI <span id="hi-display">00000</span></div>
</div>

<div id="game-wrapper">
  <canvas id="canvas" width="700" height="180"></canvas>
  <div id="overlay">
    <div id="overlay-title">DINO RUN</div>
    <div id="overlay-sub">ESPAÇO / SETA CIMA / TOQUE PARA PULAR</div>
    <button id="start-btn">INICIAR</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND = H - 30;

let state = 'idle';
let score = 0, hiScore = 0, frame = 0, speed = 4;
let animId;

// ── Dino ──────────────────────────────────────────────────────────────
const dino = {
  x: 80, y: GROUND, w: 28, h: 38,
  vy: 0, onGround: true, legPhase: 0,
  jump() {
    if (this.onGround) { this.vy = -11; this.onGround = false; }
  },
  update() {
    this.vy += 0.55;
    this.y += this.vy;
    if (this.y >= GROUND) { this.y = GROUND; this.vy = 0; this.onGround = true; }
    if (this.onGround) this.legPhase += 0.35;
  },
  draw() {
    const x = this.x, y = this.y - this.h;
    ctx.fillStyle = '#d4d4d4';
    ctx.fillRect(x, y + 6, 26, 20);
    ctx.fillRect(x + 10, y, 18, 16);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(x + 22, y + 4, 4, 4);
    ctx.fillStyle = '#d4d4d4';
    ctx.fillRect(x + 26, y + 8, 6, 4);
    ctx.fillRect(x - 6, y + 16, 8, 8);
    ctx.fillStyle = '#aaa';
    const l1 = Math.sin(this.legPhase) * 5;
    const l2 = Math.sin(this.legPhase + Math.PI) * 5;
    if (this.onGround) {
      ctx.fillRect(x + 4, y + 26 + l1, 7, 10);
      ctx.fillRect(x + 14, y + 26 + l2, 7, 10);
    } else {
      ctx.fillRect(x + 4, y + 28, 7, 8);
      ctx.fillRect(x + 14, y + 24, 7, 8);
    }
  }
};

// ── Obstacles ─────────────────────────────────────────────────────────
let obstacles = [], nextObs = 90;

function spawnObs() {
  const types = [
    { w: 16, h: 36, fly: false },
    { w: 28, h: 22, fly: false },
    { w: 40, h: 20, fly: true },
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  const fy = t.fly ? GROUND - 46 - Math.random() * 28 : GROUND;
  obstacles.push({ x: W + 20, y: fy, w: t.w, h: t.h, fly: t.fly, wingPhase: 0 });
}

function drawCactus(o) {
  ctx.fillStyle = '#4a9a70';
  ctx.fillRect(o.x + o.w / 2 - 5, o.y - o.h, 10, o.h);
  const armY = o.y - Math.floor(o.h * 0.55);
  ctx.fillRect(o.x, armY - 10, o.w / 2 - 4, 8);
  ctx.fillRect(o.x, armY - 18, 8, 10);
  ctx.fillRect(o.x + o.w / 2 + 4, armY - 10, o.w / 2 - 4, 8);
  ctx.fillRect(o.x + o.w - 8, armY - 18, 8, 10);
}

function drawPtero(o) {
  o.wingPhase += 0.13;
  const wu = Math.sin(o.wingPhase) * 6;
  ctx.fillStyle = '#aaa';
  ctx.fillRect(o.x + 8, o.y - 10, 22, 10);
  ctx.fillRect(o.x + 28, o.y - 14, 12, 8);
  ctx.fillRect(o.x + 40, o.y - 12, 8, 4);
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(o.x + 32, o.y - 13, 3, 3);
  ctx.fillStyle = '#888';
  ctx.fillRect(o.x, o.y - 16 - wu, 14, 7);
  ctx.fillRect(o.x + 22, o.y - 16 + wu, 14, 7);
}

// ── Clouds ────────────────────────────────────────────────────────────
let clouds = [{x:200,y:30},{x:480,y:50},{x:650,y:20}];

function updateClouds() {
  clouds.forEach(c => { c.x -= 0.6; });
  clouds = clouds.filter(c => c.x > -60);
  if (clouds.length < 4 && Math.random() < 0.005)
    clouds.push({ x: W + 20, y: 12 + Math.random() * 50 });
}

function drawCloud(c) {
  ctx.fillStyle = '#1c1c1c';
  ctx.fillRect(c.x, c.y, 42, 10);
  ctx.fillRect(c.x + 8, c.y - 6, 26, 8);
  ctx.fillRect(c.x + 4, c.y - 2, 10, 6);
  ctx.fillRect(c.x + 28, c.y - 2, 10, 6);
}

// ── Ground ────────────────────────────────────────────────────────────
let gx = 0;
function drawGround() {
  ctx.fillStyle = '#2e2e2e';
  ctx.fillRect(0, GROUND + 2, W, 2);
  ctx.fillStyle = '#1e1e1e';
  for (let i = 0; i < 14; i++) {
    ctx.fillRect((gx + i * 60) % W, GROUND + 8, 28, 2);
  }
}

// ── Collision ─────────────────────────────────────────────────────────
function collides(a, b) {
  const p = 7;
  return (
    a.x + p < b.x + b.w - p &&
    a.x + a.w - p > b.x + p &&
    a.y - a.h + p < b.y &&
    a.y - p > b.y - b.h
  );
}

function pad(n) { return String(Math.floor(n)).padStart(5, '0'); }

// ── Loop ──────────────────────────────────────────────────────────────
function loop() {
  ctx.clearRect(0, 0, W, H);
  frame++;
  score += 0.1;
  speed = 4 + score * 0.003;
  gx = (gx - speed + W) % W;

  updateClouds();
  clouds.forEach(drawCloud);
  drawGround();

  nextObs--;
  if (nextObs <= 0) {
    spawnObs();
    nextObs = Math.max(38, 55 + Math.random() * 55 - score * 0.04);
  }

  let dead = false;
  obstacles.forEach(o => {
    o.x -= speed;
    if (o.fly) drawPtero(o); else drawCactus(o);
    if (collides(dino, o)) dead = true;
  });
  obstacles = obstacles.filter(o => o.x + o.w > -10);

  dino.update();
  dino.draw();

  document.getElementById('score-display').textContent = pad(score);

  if (dead) { endGame(); return; }
  animId = requestAnimationFrame(loop);
}

function startGame() {
  score = 0; frame = 0; speed = 4;
  obstacles = []; nextObs = 90;
  dino.y = GROUND; dino.vy = 0; dino.onGround = true;
  document.getElementById('overlay').classList.add('hidden');
  state = 'running';
  loop();
}

function endGame() {
  cancelAnimationFrame(animId);
  state = 'dead';
  if (score > hiScore) hiScore = score;
  document.getElementById('hi-display').textContent = pad(hiScore);
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  document.getElementById('overlay-title').textContent = 'GAME OVER';
  document.getElementById('overlay-sub').textContent = 'SCORE ' + pad(score);
  document.getElementById('start-btn').textContent = 'TENTAR NOVAMENTE';
}

// ── Input ─────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'ArrowUp') && state === 'running') {
    e.preventDefault(); dino.jump();
  }
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'running') dino.jump();
}, { passive: false });
document.getElementById('start-btn').addEventListener('click', startGame);
</script>
</body>
</html>
