<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área de Jogos</title>

<link rel="stylesheet" href="./css/style.css">

<style>

/* FUNDO */
body {
    background: linear-gradient(180deg, #0b0b0b, #111);
    color: white;
    font-family: Arial;
}

/* NAVBAR */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(0,0,0,0.8);
    padding: 15px;
    text-align: center;
    font-size: 20px;
    z-index: 1000;
}

/* CONTAINER */
.jogos {
    padding: 100px 20px;
}

/* GRID */
.container-jogos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 25px;
}

/* CARD JOGO */
.jogo {
    background: #1a1a1a;
    border-radius: 15px;
    overflow: hidden;
    transition: 0.4s;
    position: relative;
}

/* HOVER */
.jogo:hover {
    transform: scale(1.05);
}

/* CAPA */
.capa {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

/* CONTEÚDO */
.jogo-content {
    padding: 15px;
}

/* BOTÃO */
.play-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 15px;
    background: #e50914;
    color: black;
    border-radius: 5px;
    text-decoration: none;
    transition: 0.3s;
}

.play-btn:hover {
    transform: scale(1.1);
}

/* MODAL (TELA GRANDE) */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.modal iframe {
    width: 80%;
    height: 80%;
    border-radius: 10px;
}

.fechar {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 30px;
    cursor: pointer;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    🎮 Área de Jogos | <a href="pagina.html" style="color:white;">Voltar</a>
</div>

<section class="jogos">

<h1>🔥 Jogos Disponíveis</h1>

<div class="container-jogos">

    <!-- JOGO 1 -->
    <div class="jogo">
        <img src="img/dino.jpg" class="capa">

        <div class="jogo-content">
            <h3>Dino Game</h3>
            <p>Jogo clássico do dinossauro do Google</p>
            <button class="play-btn" onclick="abrirJogo('dino/dino.html')">▶ Jogar</button>
        </div>
    </div>

    <!-- JOGO 2 -->
    <div class="jogo">
        <img src="img/game2.jpg" class="capa">

        <div class="jogo-content">
            <h3>Jogo Online</h3>
            <p>Divirta-se com este jogo incrível</p>
            <button class="play-btn" onclick="abrirJogo('jogos.htm/jogo.html')">▶ Jogar</button>
        </div>
    </div>

</div>

</section>

<!-- MODAL DO JOGO -->
<div class="modal" id="modal">
    <span class="fechar" onclick="fecharJogo()">✖</span>
    <iframe id="gameFrame"></iframe>
</div>

<script>
function abrirJogo(link) {
    const modal = document.getElementById("modal");
    const frame = document.getElementById("gameFrame");

    frame.src = link;
    modal.style.display = "flex";
}

function fecharJogo() {
    const modal = document.getElementById("modal");
    const frame = document.getElementById("gameFrame");

    modal.style.display = "none";
    frame.src = "";
}
</script>

</body>
</html>
